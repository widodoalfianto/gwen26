        // --- Timer Logic ---
        const timerText = document.getElementById('timer-text');
        const timerRing = document.getElementById('timer-ring');
        const timerContainer = document.getElementById('timer-container');
        let timeLeft = 60;
        const totalTime = 60;
        const circumference = 2 * Math.PI * 44; // r=44

        function updateTimer() {
            timeLeft--;
            timerText.textContent = timeLeft;

            const offset = circumference - (timeLeft / totalTime) * circumference;
            timerRing.style.strokeDashoffset = offset;

            if (timeLeft <= 10) {
                timerContainer.classList.add('timer-danger');
                timerRing.classList.remove('text-secondary');
                timerRing.classList.add('text-error');
                timerText.classList.add('text-error');
            }

            if (timeLeft > 0) {
                setTimeout(updateTimer, 1000);
            } else {
                timerContainer.classList.remove('timer-danger');
                // Handle timer end (e.g., reveal next sound)
            }
        }
        
        // Start timer
        setTimeout(updateTimer, 1000);


        // --- Bingo Stamp Logic ---
        // Hand-drawn SVG paths for stamps
        const stampPaths = [
            // X path 1
            `<svg viewBox="0 0 100 100" class="w-full h-full p-2" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 20 Q 50 50 80 80 M 80 20 Q 50 50 20 80" stroke-dasharray="1000" stroke-dashoffset="0"/>
                <path d="M18 22 Q 48 52 78 82 M 78 22 Q 48 52 18 82" stroke-width="2" opacity="0.5"/>
            </svg>`,
            // X path 2 (slightly different)
            `<svg viewBox="0 0 100 100" class="w-full h-full p-2" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 25 L 85 75 M 85 25 L 15 75" />
                <path d="M17 23 L 83 73 M 83 23 L 17 73" stroke-width="3" opacity="0.6"/>
            </svg>`
        ];

        function toggleStamp(btn) {
            const container = btn.querySelector('.stamp-container');
            const isStamped = !container.classList.contains('hidden');

            if (isStamped) {
                // Unstamp
                container.classList.add('hidden');
                container.innerHTML = '';
                btn.classList.remove('tile-pressed');
            } else {
                // Stamp
                // Randomly pick red (error) or black (on-surface)
                const isRed = Math.random() > 0.5;
                const colorClass = isRed ? 'text-error' : 'text-on-surface';
                
                // Randomly pick a path
                const pathIndex = Math.floor(Math.random() * stampPaths.length);
                
                container.innerHTML = stampPaths[pathIndex];
                container.classList.remove('hidden');
                container.classList.add(colorClass, 'animate-stamp');
                btn.classList.add('tile-pressed');

                // Vibrate if supported
                if (navigator.vibrate) {
                    navigator.vibrate(50);
                }

                // Remove animation class after it completes so it can play again if toggled
                setTimeout(() => {
                    container.classList.remove('animate-stamp');
                }, 300);
            }
        }
    </script>
</body></html>
